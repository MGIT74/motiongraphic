name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Exception de test strictement locale au runner CI ; jamais en production XCloud.
      STUDIO_CI_TEST_BYPASS: "local-only"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npx next typegen && npm run typecheck

      - name: Build
        run: npm run build

      - name: Installer Chromium (tests navigateur)
        run: npx playwright install --with-deps chromium

      - name: Tests du Studio (navigateur)
        run: |
          npm start -- -p 3000 &
          npx --yes wait-on@8 http://localhost:3000/studio --timeout 60000
          BASE_URL=http://localhost:3000 SHOTS_DIR=${{ runner.temp }} npm run test:e2e

      - name: Contrôle des templates (navigateur)
        run: |
          TEMPLATE_CHECK=1 npm start -- -p 3001 &
          npx --yes wait-on@8 http://localhost:3001/dev/template-check --timeout 60000
          BASE_URL=http://localhost:3001 npm run test:templates

      - name: Images des templates contrôlés
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: templates-controle
          path: tests/templates/out/*.png
          if-no-files-found: ignore

      - name: Captures d'écran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-e2e
          path: ${{ runner.temp }}/*.png
          if-no-files-found: ignore
